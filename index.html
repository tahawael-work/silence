<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Silence Reminder float</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --mat:#2e6e5a; --grid:rgba(255,255,255,.13); --grid2:rgba(255,255,255,.06);
  --paper:#fffdf7; --ink:#1f2a4d; --note:#ffe17d; --blush:#ffd3cc;
  --yarn:#2f80c8; --coral:#ef5b4c; --felt:#f5b83d; --pink:#f4a6b8; --sky:#8fd0ee; --lime:#8bb83a;
  --shade:rgba(10,30,25,.35);
  --hand:"Patrick Hand","Segoe Print","Bradley Hand","Comic Sans MS",cursive;
  --brush:"Caveat Brush","Segoe Print","Bradley Hand","Comic Sans MS",cursive;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--mat:#193a31;--grid:rgba(255,255,255,.09);--grid2:rgba(255,255,255,.04);--paper:#efe9da;--note:#e8c964;--blush:#f0bdb5;--shade:rgba(0,0,0,.5);}
}
:root[data-theme="dark"]{--mat:#193a31;--grid:rgba(255,255,255,.09);--grid2:rgba(255,255,255,.04);--paper:#efe9da;--note:#e8c964;--blush:#f0bdb5;--shade:rgba(0,0,0,.5);}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;color:var(--ink);font-family:var(--hand);font-size:1.15rem;
  background-color:var(--mat);
  background-image:
    linear-gradient(var(--grid) 1.5px,transparent 1.5px),
    linear-gradient(90deg,var(--grid) 1.5px,transparent 1.5px),
    linear-gradient(var(--grid2) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid2) 1px,transparent 1px);
  background-size:80px 80px,80px 80px,16px 16px,16px 16px;
  display:flex;justify-content:center;
}
main{width:100%;max-width:440px;padding:34px 22px 48px;display:flex;flex-direction:column;align-items:center;gap:26px}

.tape{
  font-family:var(--brush);font-size:2.3rem;line-height:1;color:var(--ink);
  padding:12px 34px;transform:rotate(-2.5deg);position:relative;
  background:repeating-linear-gradient(-45deg,var(--pink) 0 10px,#fbd2dc 10px 20px);
  box-shadow:0 3px 0 var(--shade);
  clip-path:polygon(0 0,3% 12%,0 25%,3% 38%,0 50%,3% 62%,0 75%,3% 88%,0 100%,100% 100%,97% 88%,100% 75%,97% 62%,100% 50%,97% 38%,100% 25%,97% 12%,100% 0);
}
h1{margin:0;font:inherit}

.dial{position:relative;width:min(80vw,310px);aspect-ratio:1;filter:drop-shadow(0 6px 0 var(--shade))}
.dial svg{width:100%;height:100%;display:block}
.paper{fill:var(--paper);transition:fill .3s}
.edge{fill:none;stroke:var(--ink);stroke-width:.8;stroke-dasharray:2.4 2.4;opacity:.5}
.stitch{fill:none;stroke:var(--ink);stroke-width:1.4;stroke-dasharray:3 3.4;opacity:.45}
.yarn{fill:none;stroke:var(--yarn);stroke-width:8;stroke-linecap:round;transition:stroke .3s}
.fluff{fill:none;stroke:#fff;stroke-width:1.6;stroke-dasharray:1.2 2.6;opacity:.55}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;padding:0 22%}
.time{font-family:var(--brush);font-size:clamp(3rem,15vw,4.4rem);line-height:1;font-variant-numeric:tabular-nums}
.state{font-size:1.15rem;line-height:1.15;min-height:2.3em;display:flex;align-items:center}
.dial.alert .paper{fill:var(--blush)}
.dial.alert .yarn{stroke:var(--coral)}
.dial.alert .time,.dial.alert .state{color:var(--coral)}
.dial.alert{animation:wiggle .5s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}

.beads{display:flex;gap:6px;height:26px;align-items:flex-end;width:100%;justify-content:center}
.beads i{width:14px;height:100%;border-radius:8px;background:rgba(255,255,255,.18);border:2px dashed rgba(255,255,255,.45);transition:background .08s,border-color .08s}
.beads i:nth-child(3n+1).on{background:var(--pink)}
.beads i:nth-child(3n+2).on{background:var(--felt)}
.beads i:nth-child(3n).on{background:var(--sky)}
.beads i.on{border-color:var(--ink);border-style:solid}

.wave{width:min(92vw,1600px);flex:none;background:var(--paper);border:2.5px dashed var(--ink);border-radius:14px;padding:10px 22px 8px;box-shadow:0 6px 0 var(--shade);transform:rotate(-.6deg)}
.wave .cap{display:flex;justify-content:space-between;font-size:1rem;margin-bottom:2px}
.wave .cap b{font-family:var(--brush);font-weight:400;font-size:1.2rem}
.wscroll{overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.wwrap{position:relative}
.wlab{position:absolute;left:6px;z-index:1;pointer-events:none;font-size:.85rem;line-height:1.3;padding:0 7px;border-radius:9px;background:rgba(255,253,247,.8)}
#lyou{color:var(--yarn)}
#lspk{color:#5f8a1f}
.wscroll::-webkit-scrollbar{display:none;height:0}
.wave .cap{align-items:center}
.wave .cap .rt{display:flex;align-items:center;gap:12px}
.wave .cap button{font-size:1.05rem;padding:2px 16px;margin:0;box-shadow:0 3px 0 var(--shade)}
.wave .cap button::after{inset:3px;border-width:2px}
.wbar{position:relative;height:16px;margin-top:6px;border:2px dashed var(--ink);border-radius:999px;touch-action:none;cursor:pointer}
.wbar i{position:absolute;top:1px;bottom:1px;left:0;min-width:30px;border-radius:999px;background:var(--felt);border:2px solid var(--ink);cursor:grab;touch-action:none}
.wbar i:active{cursor:grabbing}
.wbar i b{position:absolute;top:-2px;bottom:-2px;width:18px;cursor:ew-resize;touch-action:none}
.wbar i b.l{left:-4px}
.wbar i b.r{right:-4px}
.wbar i b::after{content:"";position:absolute;top:4px;bottom:4px;left:50%;width:3px;margin-left:-1.5px;border-radius:2px;background:var(--ink);opacity:.55}
/* The canvas is only as wide as the visible part of the wave. It sticks to the left edge of the
   scroller while the (empty) .wcan element provides the full scroll width. */
.wave canvas{display:block;height:150px;position:sticky;left:0}
.wcan{position:relative;width:max-content;min-width:100%}
.wcan.seek{cursor:pointer}
#phead{position:absolute;top:0;bottom:18px;width:4px;margin-left:-2px;background:var(--coral);border:1.5px solid var(--ink);border-radius:3px;pointer-events:none;display:none}
.pl{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.pl[hidden]{display:none}
.pl button{font-size:1.1rem;padding:4px 16px;min-width:0;margin:0;box-shadow:0 3px 0 var(--shade)}
.pl button::after{inset:3px;border-width:2px}
.pl button:disabled{opacity:.45;cursor:default}
#pplay{min-width:68px;font-size:1.3rem;background:var(--coral);color:#fff}
#pplay::after{border-color:#fff}
#pdownload{background:var(--sky)}
#ptime{font-variant-numeric:tabular-nums;min-width:5.6em;text-align:center}
.mk{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-start;margin-top:8px}
.mk input{font:inherit;font-size:.95rem;width:9em;padding:1px 10px;border:2px solid var(--ink);border-radius:999px;background:var(--paper);color:var(--ink)}
.mk[hidden]{display:none}
.mk .chip{display:inline-flex;align-items:stretch}
.mk .chip button{font-size:.95rem;padding:1px 10px;min-width:0;margin:0;background:var(--pink);box-shadow:0 2px 0 var(--shade)}
.mk .chip button::after{inset:2px;border-width:1.5px}
.mk .chip button.x{padding:1px 8px;margin-left:3px;background:var(--paper)}
#selInfo{font-size:.92rem;min-height:1.3em;color:var(--ink);opacity:.8;text-align:center;line-height:1.3}

button{
  font-family:var(--brush);font-size:1.7rem;color:var(--ink);cursor:pointer;
  background:var(--felt);border:0;border-radius:999px;padding:16px 44px;min-width:240px;position:relative;
  box-shadow:0 6px 0 var(--shade);transition:transform .1s,box-shadow .1s;
}
button::after{content:"";position:absolute;inset:6px;border:2.5px dashed var(--ink);border-radius:999px;opacity:.55;pointer-events:none}
button:active{transform:translateY(5px);box-shadow:0 1px 0 var(--shade)}
button:disabled{opacity:.6;cursor:default}
button.stop{background:var(--paper)}
button.ghost{font-size:1.3rem;padding:10px 28px;min-width:0;background:var(--sky);margin-top:-12px}
button.ghost::after{inset:4px}
button[hidden]{display:none}
button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:4px}
.msg{min-height:1.3em;color:#fff;text-align:center;font-size:1.05rem;margin-top:-10px;text-shadow:0 1px 0 var(--shade);opacity:1;transition:opacity .3s}

.note{
  position:relative;width:100%;background:var(--note);padding:30px 22px 20px;transform:rotate(1.2deg);
  box-shadow:0 6px 0 var(--shade);display:grid;gap:6px;
  border-radius:2px 2px 26px 2px;
}
.note::before{
  content:"";position:absolute;top:-14px;left:50%;width:110px;height:28px;transform:translateX(-50%) rotate(-3deg);
  background:repeating-linear-gradient(90deg,rgba(143,208,238,.85) 0 10px,rgba(255,255,255,.75) 10px 20px);
}
.note label{display:flex;justify-content:space-between;align-items:baseline;font-size:1.2rem}
.note label b{font-family:var(--brush);font-weight:400;font-size:1.35rem}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0 0 6px}
input[type=range]::-webkit-slider-runnable-track{height:0;border-top:3px dashed var(--ink)}
input[type=range]::-moz-range-track{height:0;border-top:3px dashed var(--ink)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--coral);border:3px solid var(--ink);margin-top:-13px;box-shadow:0 2px 0 var(--shade)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--coral);border:3px solid var(--ink)}

input[type=checkbox]{width:26px;height:26px;accent-color:var(--coral);margin:0;cursor:pointer;flex:none}
@media (prefers-reduced-motion:reduce){.dial.alert{animation:none}button{transition:none}}

.note input[type=password],.note textarea{font:inherit;font-size:1rem;width:100%;border:2px solid var(--ink);border-radius:10px;padding:6px 10px;background:var(--paper);color:var(--ink);margin-bottom:6px;resize:vertical}
.ans{width:100%;background:var(--paper);border:2.5px dashed var(--ink);border-radius:14px;padding:12px 16px;box-shadow:0 6px 0 var(--shade);font-size:1.2rem;line-height:1.3;white-space:pre-wrap;cursor:pointer;transform:rotate(.5deg)}
.ans[hidden]{display:none}
body.drop::after{
  content:"Drop audio to load it";position:fixed;inset:12px;z-index:10;pointer-events:none;
  display:flex;align-items:center;justify-content:center;text-align:center;
  font-family:var(--brush);font-size:2.4rem;color:#fff;
  background:rgba(0,0,0,.4);border:4px dashed #fff;border-radius:24px;
}
</style>
</head>
<body>
<main>
  <div class="dial" id="dial" role="timer" aria-live="off">
    <svg viewBox="0 0 120 120" aria-hidden="true">
      <circle class="paper" cx="60" cy="60" r="58"/>
      <circle class="edge" cx="60" cy="60" r="55.5"/>
      <g transform="rotate(-90 60 60)">
        <circle class="stitch" cx="60" cy="60" r="47"/>
        <circle class="yarn" id="prog" cx="60" cy="60" r="47" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0"/>
        <circle class="fluff" id="fluff" cx="60" cy="60" r="47" pathLength="100" stroke-dashoffset="0"/>
      </g>
    </svg>
    <div class="center">
      <div class="time" id="time">0:00</div>
      <div class="state" id="state">Not listening</div>
    </div>
  </div>

  <div class="beads" id="beads" aria-hidden="true"></div>

  <div class="wave">
    <div class="cap"><b>Session wave</b><span class="rt"><span id="wtime">0:00</span><button id="clr" class="ghost" type="button">Clear</button></span></div>
    <div class="wwrap"><div class="wscroll" id="wscroll"><div class="wcan" id="wcan"><canvas id="wave" role="img" aria-label="Waveform of the session so far"></canvas><div id="phead"></div></div></div><span class="wlab" id="lyou" hidden>you</span><span class="wlab" id="lspk" hidden>speaker</span></div>
    <div class="wbar" id="wbar" title="Drag the ends to zoom, double-click to reset"><i id="wthumb"><b class="l"></b><b class="r"></b></i></div>
    <div class="pl" id="pl" hidden>
      <button id="pback" type="button" aria-label="Back 10 seconds">&minus;10</button>
      <button id="pplay" type="button" aria-label="Play">&#9654;</button>
      <button id="pfwd" type="button" aria-label="Forward 10 seconds">+10</button>
      <span id="ptime">0:00 / 0:00</span>
      <button id="prate" type="button" aria-label="Playback speed">1&times;</button>
      <button id="pdownload" type="button">Download</button>
    </div>
    <div id="selInfo" aria-live="polite"></div>
    <div class="mk" id="mk" hidden></div>
  </div>

  <button id="btn">Start listening</button>
  <button id="pip" class="ghost">Float on top</button>
  <button id="mark" class="ghost" title="Shortcut: M">Add marker (M)</button>
  <button id="spk" class="ghost">Add speaker sound</button>
  <button id="help" class="ghost" title="Shortcut: H">Help me collect (H)</button>
  <button id="trbtn" class="ghost" title="Transcribe the selected section" hidden>Transcribe selection</button>
  <div class="ans" id="ans" hidden title="Click to dismiss"></div>
  <div class="msg" id="msg" role="status"></div>

  <div class="note">
    <label for="limit">Quiet limit <b id="limVal">2:00</b></label>
    <input type="range" id="limit" min="30" max="300" step="15" value="120">
    <label for="sens">Mic sensitivity <b id="sensVal">7</b></label>
    <input type="range" id="sens" min="1" max="10" value="7">
    <label for="ssens">Speaker sensitivity <b id="ssensVal">1</b></label>
    <input type="range" id="ssens" min="1" max="10" value="1">
    <label for="rep">Nag me every <b id="repVal">20s</b></label>
    <input type="range" id="rep" min="3" max="60" step="1" value="20">
    <label for="incl">Speaker sound counts as talking <input checked type="checkbox" id="incl"></label>
    <label for="ovl">Overlap waveforms <input type="checkbox" id="ovl" checked></label>
    <label for="gkey">Groq API key</label>
    <input type="password" id="gkey" placeholder="gsk_..." autocomplete="off">
    <label for="ctxs">Audio sent to live help <b id="ctxVal">45s</b></label>
    <input type="range" id="ctxs" min="10" max="180" step="5" value="45">
    <label for="sysp">System prompt</label>
    <textarea id="sysp" rows="10">You are a live call coach for a collections agent. The agent is on a call with a customer who has an overdue balance. You can hear the call in real time. The agent will message you only when they are stuck or need help, so respond fast and keep it short.

GOAL
Help the agent collect the FULL past-due balance TODAY, on this call. A partial payment is not the target. Only fall back to one if the agent asks or the full amount is clearly impossible.

HOW TO RESPOND
- Read the latest part of the call and the agent's request first.
- Give the agent something to say right now: one suggested line, in natural spoken language, 1-3 sentences.
- Add a one-line tip on what to do next, if useful.
- No long explanations. The agent is mid-call and has seconds, not minutes.

HOW TO GET FULL PAYMENT TODAY
1. Find the real reason for non-payment (forgot, cash flow, dispute, hardship, avoidance) and tailor your line to it.
2. Make paying today easy: offer to take payment right now, by card or bank, and walk them through it.
3. Handle objections calmly and confidently. Acknowledge, then redirect to resolving it today.
4. Create legitimate urgency: real consequences such as late fees, service impact, or account status, but only if those are accurate for this account.
5. Use incentives strategically and as a last resort, never as the opening move:
   - First try: payment ease, empathy, and reasons to resolve today.
   - Then: a one-time credit, to close the gap if the customer is close.
   - Then: a discount, only when it is what makes the customer pay the full remaining balance today.
   - Always tell the agent the smallest incentive likely to close the sale, and what the customer pays after it. Do not give away more than needed.
6. Always ask for the close: "Can we take care of the full amount right now?"

HARD RULES
- Never suggest threats, harassment, lies, false deadlines, or false legal claims (for example, claiming a lawsuit is coming when it is not).
- Never suggest misrepresenting the amount owed, the consequences, or who the agent is.
- If the customer disputes the debt, says they are in a protected situation, or asks to stop contact, tell the agent to follow company procedure and do not push further.
- Never suggest discussing the debt with anyone other than the customer.
- Stay respectful. A calm, confident, helpful tone collects more than pressure does.

additional info
- we have credit limit 1500 a month, 150 per account max.
- payment plan counts as a partial payment so its not good.
- we almost never give extensions cuz it counts as no payment.
- we benefit from getting disconnected account out of collection more than active account.</textarea>
    <label for="trans">Last transcript</label>
    <textarea id="trans" rows="5" readonly placeholder="What was transcribed will show up here after you press Help or Transcribe."></textarea>
  </div>
</main>

<script>
(function(){
  var $ = function(id){return document.getElementById(id)};
  var btn=$('btn'), pipBtn=$('pip'), dial=$('dial'), prog=$('prog'), fluff=$('fluff'), timeEl=$('time'), stateEl=$('state'),
      msg=$('msg'), limit=$('limit'), limVal=$('limVal'), sens=$('sens'), beadsEl=$('beads');
  var stream=null, ctx=null, analyser=null, buf=null, wakeLock=null, tick=null, worker=null, workerUrl=null, msgTimer=null;
  var lastSound=0, lastAlert=0, lastRun=0, lastDraw=0, alerting=false, running=false, starting=false;
  var N=14, beads=[];

  /* ---------- limits ---------- */
  var MAX_SEC=3600;      /* recording window that is kept (older audio is dropped) */
  var TRIM_STEP=15;      /* the window is trimmed in steps of this many seconds once it is over the limit */
  var ROT_SEC=60;        /* a new recording segment starts this often, so old audio can be dropped whole */
  var LIVE_SEC=190;      /* seconds of live audio kept in memory (16 kHz) for the live Help button */
  var CHUNK_SEC=600;     /* a selection is transcribed in chunks of this length (keeps each upload small) */
  var LLM_MODEL='qwen/qwen3.8-27b';

  for(var b=0;b<N;b++){var el=document.createElement('i');beadsEl.appendChild(el);beads.push(el)}

  function fmt(s){s=Math.max(0,Math.floor(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
  function setText(el,t){if(el._t!==t){el._t=t;el.textContent=t}}
  function thr(inp){return 0.05-(+inp.value-1)*0.0045}
  function toI16(v){v=v>1?1:v<-1?-1:v;return Math.round(v*(v<0?32768:32767))}
  function showMsg(text,ms){
    clearTimeout(msgTimer);
    msg.textContent=text;
    msg.style.opacity='1';
    if(text) msgTimer=setTimeout(function(){
      msg.style.opacity='0';
      msgTimer=setTimeout(function(){msg.textContent='';msg.style.opacity='1'},300);
    },ms||2500);
  }
  limit.addEventListener('input',function(){limVal.textContent=fmt(+limit.value)});
  sens.addEventListener('input',function(){$('sensVal').textContent=sens.value});
  $('ssens').addEventListener('input',function(){$('ssensVal').textContent=$('ssens').value});
  $('rep').addEventListener('input',function(){$('repVal').textContent=$('rep').value+'s'});

  /* colours are read from CSS, but not on every frame */
  var cssC={}, cssT=0;
  function css(n){
    var t=Date.now();
    if(t-cssT>1000){cssC={};cssT=t}
    return cssC[n]||(cssC[n]=getComputedStyle(document.documentElement).getPropertyValue(n).trim());
  }

  /* ---------- session waveform ---------- */
  var wc=$('wave'), wg=wc.getContext('2d'), BK=250, PER=1000/BK;
  var peaks=[], speaks=[], flags=[], startT=0, lastWave=0, MAXV=1200, follow=true, wTot=60, viewSec=null, fullW=0;
  var scrollAnchor=null, trimNotified=false, exporting=false, loading=false;
  var spkStream=null, spkAn=null, spkBuf=null, spkUsed=false;
  var activeSelection=null, selecting=null, markers=[];

  function waveEnd(){return peaks.length/PER}
  function updateSelectionInfo(){
    var sel=activeSelection, txt='';
    if(!running&&segs.length){
      txt=sel?('Selected '+fmt(sel.start)+' to '+fmt(sel.end)+' ('+fmt(sel.end-sel.start)+'). Download it, transcribe it, or ask for help.')
             :'Drag on the wave to select a section';
    }
    setText($('selInfo'),txt);
    setText($('pdownload'),exporting?'Preparing MP3...':(sel?'Download selected':'Download'));
  }
  function getWaveTimeFromEvent(e){
    var r=$('wcan').getBoundingClientRect();
    var t=(Math.max(0,Math.min(r.width,e.clientX-r.left))/Math.max(1,r.width))*wTot;
    return Math.min(t,waveEnd());
  }
  function rec_(now,rms,sp){
    var i=Math.max(0,Math.floor((now-startT)/BK));
    while(peaks.length<=i){peaks.push(0);speaks.push(0);flags.push(0)}
    if(rms>peaks[i]) peaks[i]=rms;
    if(sp>speaks[i]) speaks[i]=sp;
    if(alerting) flags[i]=1;
  }
  function markNow(){return running?Math.max(0,(performance.now()-startT)/1000):(segs.length?pos():0)}
  function mName(m,i){return m.label||('Marker '+(i+1))}
  function renderMarkers(){
    var box=$('mk'); box.innerHTML=''; box.hidden=!markers.length;
    markers.forEach(function(m,i){
      var c=document.createElement('span'); c.className='chip';
      var a=document.createElement('button'); a.type='button'; a.textContent=mName(m,i)+' \u00b7 '+fmt(m.t);
      a.setAttribute('aria-label','Go to '+mName(m,i));
      a.addEventListener('click',function(){
        var sc=$('wscroll'); follow=false;
        sc.scrollLeft=Math.max(0,m.t/wTot*sc.scrollWidth-40);
        if(!running&&segs.length) seekTo(m.t,isPlaying());
      });
      var e=document.createElement('button'); e.type='button'; e.className='x'; e.textContent='\u270e';
      e.setAttribute('aria-label','Rename '+mName(m,i));
      e.addEventListener('click',function(){editMarker(m,c)});

  function wavBlob(pcm){

      var e=Math.min(len,(w+1)*WIN), sq=0;
      m=0; for(q=w*WIN;q<e;q++){var v=pcm[q]<0?-pcm[q]:pcm[q];if(v>m)m=v;sq+=v*v}
      if(m>THR&&Math.sqrt(sq/Math.max(1,e-w*WIN))>THR*0.25){if(first<0)first=w;last=w}
    }

    var tail=(len-to)/16000;

      var a=Math.max(0,Math.floor(s.start*16000)), z=Math.min(blob.pcm.length,Math.ceil(s.end*16000)), mx=0;
      for(var q=a;q<z;q++){var v=Math.abs(blob.pcm[q]);if(v>mx)mx=v}
      if(mx<blob.thr) return;
      out.push({t:baseT+s.start,text:tx,who:who});
    });
    if(!out.length&&!(j.segments&&j.segments.length)&&(j.text||'').trim()) out.push({t:baseT,text:j.text.trim(),who:who});
    return out;
  }
  function toTranscript(entries){
    entries.sort(function(a,b){return a.t-b.t});
    var lines=[];
    entries.forEach(function(s){
      var last=lines[lines.length-1];
      if(last&&last.who===s.who) last.text+=' '+s.text; else lines.push({who:s.who,text:s.text});
    });
    return lines.map(function(l){return l.who+': '+l.text}).join('\n');
  }
  async function askCoach(key,heard,hasCall,selected){
    var sys=($('sysp').value.trim()||$('sysp').defaultValue.trim());
    if(heard.length>60000) heard='[...]\n'+heard.slice(-60000);
    var intro=selected?'Transcript of a section of my call that I selected from the recording. ':'Transcript of the last moments of my conversation. ';
    intro+='"Me" is my microphone (me), "Them" is the other side (speaker or the customer\'s audio). ';
    if(hasCall) intro+='Lines labelled "Call" come from a mixed recording where the two sides are not separated, so work out who is the agent and who is the customer from context. ';
    intro+='Lines are in time order:\n';
    var r=await fetch('https://api.groq.com/openai/v1/chat/completions',{
      method:'POST',
      headers:{Authorization:'Bearer '+key,'Content-Type':'application/json'},
      body:JSON.stringify({model:LLM_MODEL,temperature:0.5,max_tokens:700,messages:[
          {role:'system',content:sys},
          {role:'user',content:intro+heard}
      ]})
    });
    if(!r.ok) throw new Error(await groqErr(r));
    var reply=(((await r.json()).choices||[{}])[0].message||{}).content||'';
    reply=reply.replace(/<think>[\s\S]*?<\/think>/gi,'').replace(/<think>[\s\S]*$/i,'').trim();
    return reply||'No suggestion came back.';
  }

  /* live help while listening: the last few seconds, mic and speaker kept apart */
  async function helpLive(){
    if(!running||!cap.mic||cap.mic.n<16000){showMsg('Start listening first, then ask for help.');return}
    var key=$('gkey').value.trim();
    if(!key){showMsg('Paste your Groq API key in the settings first.');return}
    setBusy(true);
    showAns('Thinking\u2026');
    try{
      var avail=Math.max(1,Math.floor(cap.mic.n/16000));
      var sec=Math.min(ctxWant,avail);
      var micBlob=liveBlob(cap.mic,sec,thr(sens)), spkBlob=(spkAn&&cap.spk)?liveBlob(cap.spk,sec,thr($('ssens'))):null;
      var parts=await Promise.all([
        micBlob?transcribeBlob(micBlob,'Me',key,-(micBlob.dur+micBlob.tail)):[],
        spkBlob?transcribeBlob(spkBlob,'Them',key,-(spkBlob.dur+spkBlob.tail)):[]
      ]);
      var heard=toTranscript(parts[0].concat(parts[1]));
      setTrans(heard);
      if(!heard){showAns('I could not hear any speech in that stretch.');return}
      var reply=await askCoach(key,heard,false,false);
      showAns(reply);
      if(window.Notification&&Notification.permission==='granted'&&document.hidden){
        try{new Notification('Collection tip',{body:reply})}catch(e){}
      }
    }catch(e){
      showAns('Help failed: '+((e&&e.message)||e));
    }finally{
      setBusy(false);
    }
  }

  /* ---------- transcribing a selected section (while paused) ---------- */
  async function decodeBlob(blob){return ctx.decodeAudioData(await blob.arrayBuffer())}
  /* copies the part of a decoded segment that falls into [c0,c1) into a 16 kHz mono lane */
  function addRange(lanes,name,b,chs,s,c0,c1,len){
    var sr=b.sampleRate, from=Math.max(c0,s.start), to=Math.min(c1,s.start+b.duration);
    if(to<=from) return;
    var i0=Math.floor((from-s.start)*sr), i1=Math.min(b.length,Math.ceil((to-s.start)*sr));
    var o=Math.round((from-c0)*16000);
    var out=lanes[name]||(lanes[name]=new Int16Array(len));
    var ratio=sr/16000, m=Math.min(out.length-o,Math.floor((i1-i0)/ratio));
    var datas=chs.map(function(c){return b.getChannelData(c)}), nc=datas.length;
    for(var j=0;j<m;j++){
      var a=i0+Math.floor(j*ratio), z=Math.min(i1,Math.max(a+1,i0+Math.floor((j+1)*ratio))), sum=0;
      for(var k=a;k<z;k++){for(var q=0;q<nc;q++) sum+=datas[q][k]}
      out[o+j]=toI16(sum/((z-a)*nc));
    }
  }
  async function transcribeRange(a,b,key,status){
    var snap=segs.map(function(s){return {blob:s.blob,split:s.split,start:s.start,dur:s.dur}})
      .filter(function(s){return s.start<b&&s.start+s.dur+2>a})
      .sort(function(x,y){return x.start-y.start});
    if(!snap.length) return {heard:'',hasCall:false};
    var n=Math.max(1,Math.ceil((b-a)/CHUNK_SEC)), entries=[], hasCall=false;
    var th={Me:thr(sens),Them:thr($('ssens')),Call:0};
    for(var c=0;c<n;c++){
      var c0=a+c*CHUNK_SEC, c1=Math.min(b,c0+CHUNK_SEC), len=Math.max(1,Math.round((c1-c0)*16000)), lanes={};
      var tag=n>1?' ('+(c+1)+'/'+n+')':'';
      status('Reading the selected audio'+tag+'\u2026');
      for(var i=0;i<snap.length;i++){
        var s=snap[i];
        if(s.start>=c1||s.start+s.dur+2<=c0) continue;
        var sb=null;
        if(s.split){try{sb=await decodeBlob(s.split)}catch(e){sb=null}}
        if(sb&&sb.numberOfChannels>=2){
          addRange(lanes,'Me',sb,[0],s,c0,c1,len);
          addRange(lanes,'Them',sb,[1],s,c0,c1,len);
        }else{
          if(!sb){try{sb=await decodeBlob(s.blob)}catch(e){continue}}
          var chs=[]; for(var q=0;q<sb.numberOfChannels;q++) chs.push(q);
          addRange(lanes,'Call',sb,chs,s,c0,c1,len);
        }
        sb=null;
      }
      var jobs=[];
      ['Me','Them','Call'].forEach(function(name){
        if(!lanes[name]) return;
        var blob=prepWav(lanes[name],th[name]);
        if(!blob) return;
        if(name==='Call') hasCall=true;
        jobs.push(transcribeBlob(blob,name,key,c0+blob.off));
      });
      lanes=null;
      status('Transcribing'+tag+'\u2026');
      var res=await Promise.all(jobs);
      res.forEach(function(r){entries=entries.concat(r)});
    }
    return {heard:toTranscript(entries),hasCall:hasCall};
  }
  async function useSelection(mode){
    if(helping) return;
    var sel=activeSelection;
    if(!sel||sel.end-sel.start<0.5){showMsg('Drag on the wave to select a section first.');return}
    var a=Math.min(sel.start,sel.end), b=Math.max(sel.start,sel.end);
    var key=$('gkey').value.trim();
    if(!key){showMsg('Paste your Groq API key in the settings first.');return}
    setBusy(true);
    showAns('Reading the selected audio\u2026');
    try{
      var r=await transcribeRange(a,b,key,showAns);
      setTrans(r.heard);
      if(!r.heard){showAns('I could not hear any speech in that section.');return}
      if(mode==='transcribe'){
        showAns('Transcript ready. It is in "Last transcript" below.');
        $('trans').scrollIntoView({behavior:'smooth',block:'center'});
        return;
      }
      showAns('Thinking\u2026');
      var reply=await askCoach(key,r.heard,r.hasCall,true);
      showAns(reply);
      if(window.Notification&&Notification.permission==='granted'&&document.hidden){
        try{new Notification('Collection tip',{body:reply})}catch(e){}
      }
    }catch(e){
      showAns((mode==='transcribe'?'Transcribing failed: ':'Help failed: ')+((e&&e.message)||e));
    }finally{
      setBusy(false);
    }
  }

  function help(){
    if(helping) return;
    if(running) return helpLive();
    if(segs.length) return useSelection('help');
    showMsg('Start listening first, then ask for help.');
  }
  $('help').addEventListener('click',help);
  $('trbtn').addEventListener('click',function(){useSelection('transcribe')});
  document.addEventListener('keydown',function(e){
    if((e.key==='h'||e.key==='H')&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!e.repeat&&!/^(INPUT|TEXTAREA|SELECT)$/.test((e.target&&e.target.tagName)||'')){
      e.preventDefault(); help();
    }
  });

  /* ---------- drop audio files ---------- */
  var dragDepth=0;
  function hasFiles(e){return e.dataTransfer&&Array.prototype.indexOf.call(e.dataTransfer.types||[],'Files')>=0}
  window.addEventListener('dragenter',function(e){if(!hasFiles(e))return;e.preventDefault();dragDepth++;document.body.classList.add('drop')});
  window.addEventListener('dragover',function(e){if(hasFiles(e))e.preventDefault()});
  window.addEventListener('dragleave',function(e){
    if(!hasFiles(e))return;
    dragDepth=Math.max(0,dragDepth-1);
    if(!dragDepth)document.body.classList.remove('drop');
  });
  window.addEventListener('drop',function(e){
    if(!hasFiles(e))return;
    e.preventDefault();dragDepth=0;document.body.classList.remove('drop');
    var files=Array.prototype.filter.call(e.dataTransfer.files,function(f){
      return /^audio\//.test(f.type)||/\.(mp3|wav|m4a|ogg|webm)$/i.test(f.name);
    });
    if(!files.length){showMsg('Drop an mp3 audio file.');return}
    loadFiles(files);
  });

  /* Files are decoded one at a time and each decoded buffer is released as soon as its wave is computed. */
  async function loadFiles(files){
    if(running){showMsg('Stop listening first, then drop a file.');return}
    if(loading||exporting) return;
    loading=true;
    showMsg('Loading...',60000);
    var nPeaks=[], nSpk=[], nFlags=[], nSegs=[];
    try{
      var AC=window.AudioContext||window.webkitAudioContext;
      if(!ctx||ctx.state==='closed') ctx=new AC();
      var tm=thr(sens), lim=+limit.value, lastS=0;
      for(var k=0;k<files.length;k++){
        var bf=await ctx.decodeAudioData(await files[k].arrayBuffer());
        var t0=nPeaks.length/PER, nb=Math.ceil(bf.duration*PER), bs=bf.sampleRate*BK/1000,
            ch=bf.numberOfChannels, data=[], c;
        for(c=0;c<ch;c++) data.push(bf.getChannelData(c));
        for(var j=0;j<nb;j++){
          var a=Math.floor(j*bs), z=Math.min(bf.length,Math.floor((j+1)*bs)), pk=0;
          for(var s=a;s<z;s+=4096){
            var en=Math.min(z,s+4096), sum=0;
            for(var x=s;x<en;x++){
              var v=0; for(c=0;c<ch;c++) v+=data[c][x];
              v/=ch; sum+=v*v;
            }
            var r=Math.sqrt(sum/Math.max(1,en-s)); if(r>pk) pk=r;
          }
          var tt=t0+j/PER;
          if(pk>tm) lastS=tt;
          nPeaks.push(pk); nSpk.push(0);
          nFlags.push(tt-lastS>=lim?1:0);
        }
        nSegs.push({blob:files[k],url:URL.createObjectURL(files[k]),start:t0,dur:bf.duration,split:null});
        bf=null; data=null;
      }
      dropRec();
      peaks=nPeaks; speaks=nSpk; flags=nFlags; segs=nSegs; spkUsed=false; markers=[]; renderMarkers(); trimNotified=false;
      follow=false; $('wscroll').scrollLeft=0;
      drawWave();
      showMsg('Loaded '+files.length+' file'+(files.length>1?'s':'')+'.');
    }catch(err){
      nSegs.forEach(function(s){URL.revokeObjectURL(s.url)});
      showMsg('Could not read that audio file.');
    }finally{
      loading=false;
    }
  }

  drawWave();
})();
</script>
</body>
